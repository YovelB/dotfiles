# never show short (8 character) key IDs
keyid-format 0xlong

# always show the full 40 character fingerprint when listing keys
with-fingerprint

# force UTF-8 output to prevent weird char rendering in zsh
charset utf-8

# do not leak the GnuPG version number in exported signatures and keys
no-emit-version

# do not leak the operating system name or comments
no-comments

# use the modern keyserver (it actually verifies emails)
keyserver hkps://keys.openpgp.org

# dont reach out to random URLs embedded in other people keys 
keyserver-options no-honor-keyserver-url
