[ids]
# match all keyboards attached to the system.
*

[main]
# map capslock to escape when tapped, but act as our custom mouse layer when held.
capslock = overload(mouse, esc)

# --- layers ---

[mouse:C-M-S]
# the :C-M-S modifier automatically sends ctrl+alt+shift alongside these keys.
# this triggers the ydotool binds configured in your niri config.

# vim-style mouse movement.
h = h
j = j
k = k
l = l

# left and right mouse clicks.
space = space
o = o
