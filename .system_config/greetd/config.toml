[terminal]
vt = 1

[default_session]
user = "greeter"
# command = "/usr/bin/dms-greeter --command niri --cache-dir /var/cache/dms-greeter"

# fallback option
command = "tuigreet --time --remember --greeting 'Access is restricted to authorized personnel only.' --window-padding 2 --container-padding 4 --theme 'border=lightgray;text=white;prompt=white;time=lightgray;action=darkgray;button=lightgray;container=black;input=white' --cmd niri-session"
